name: AI Marketing social cron

# Free, laptop-independent scheduler for the AI Marketing Automation Hub.
# Pings the site's social cron endpoint, which plans due posts and publishes any
# that are scheduled. Runs 5x/day (see schedule); can also be triggered manually.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://nutriyet.in   (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var on the deployment
#
# GitHub cron is best-effort and may drift a few minutes; the endpoint is
# idempotent, so extra or slightly-late runs are safe.

on:
  schedule:
    # 5 runs/day at IST 08:05 (plan), 09:05 + 18:05 (default post times),
    # 13:05 + 21:05 (retries / custom times). Each run wakes the Neon DB, so
    # every-30-min pings kept it from ever scaling to zero and exhausted the
    # free compute-hour quota (site down 2026-10-22). Keep this sparse.
    - cron: "35 2,3,7,12,15 * * *"
  workflow_dispatch: {}

concurrency:
  group: social-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger social cron
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "SITE_URL secret not set — skipping."; exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/social")
          echo "HTTP $code"; cat /tmp/out.json || true
          test "$code" = "200"
      - name: Trigger intelligence cron
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "SITE_URL secret not set — skipping."; exit 0
          fi
          code=$(curl -sS -o /tmp/intel.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/intelligence")
          echo "HTTP $code"; cat /tmp/intel.json || true
          test "$code" = "200"
